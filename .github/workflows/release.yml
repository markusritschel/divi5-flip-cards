# On a version tag (v1.2.3): build the plugin ZIP (with the runtime vendor/ for updates) and
# attach it to the GitHub release, created if missing. Installed sites update from this asset
# (modules/Updater/Updater.php).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          header=$(sed -n 's/^ \* Version: *//p' divi5-flip-cards.php)
          constant=$(sed -n "s/.*define( 'D5FC_VERSION', '\([^']*\)' );.*/\1/p" divi5-flip-cards.php)
          if [ "v$header" != "$GITHUB_REF_NAME" ] || [ "v$constant" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Version $header / D5FC_VERSION $constant"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer:v2
          coverage: none

      - name: Build assets and install runtime dependencies
        run: |
          npm ci
          npm run build
          composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Build ZIP
        run: |
          bash bin/make-zip.sh
          mv dist/divi5-flip-cards-*.zip "divi5-flip-cards-$GITHUB_REF_NAME.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "divi5-flip-cards-$GITHUB_REF_NAME.zip" --clobber
